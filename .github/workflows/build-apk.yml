name: Build ThongKeDonHang APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract and Fix Sources
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q -o "$ZIP_FILE" -d .
          fi
          cat << 'PYEOF' > fix_all.py
          import os, re
          root = "ThongKeDonHang" if os.path.exists("ThongKeDonHang/settings.gradle.kts") else "."
          for r, _, fs in os.walk(root):
              for f in fs:
                  if f.endswith(".kt") or f.endswith(".kts"):
                      p = os.path.join(r, f)
                      s = open(p, encoding="utf-8").read()
                      if f == "OrderCommonComponents.kt" and "import vn.thongkedonhang.app.ui.theme.SoftCreamSurface" not in s:
                          s = s.replace("import vn.thongkedonhang.app.ui.theme.PrimaryYellowDark", "import vn.thongkedonhang.app.ui.theme.PrimaryYellowDark\nimport vn.thongkedonhang.app.ui.theme.SoftCreamSurface")
                      if f == "CameraBarcodeScanner.kt":
                          s = s.replace("import androidx.annotation.OptIn\n", "").replace("@OptIn(ExperimentalGetImage::class)", "@androidx.annotation.OptIn(ExperimentalGetImage::class)")
                      if f == "MainViewModel.kt":
                          s = s.replace("val filteredOrderList: StateFlow<List<OrderItem>> = combine(", "val filteredOrderList: StateFlow<List<OrderItem>> = combine<Any?, List<OrderItem>>(")
                      if f == "build.gradle.kts":
                          s = re.sub(r"freeCompilerArgs\s*\+=\s*listOf\([^\)]*\)", "", s)
                      s = s.replace("onOpenGroupClick?.invoke(order.groupId)", "onOpenGroupClick?.invoke(order.groupId.orEmpty())")
                      s = s.replace("onOpenGroup(order.groupId)", "onOpenGroup(order.groupId.orEmpty())")
                      # Sửa toàn bộ dấu ngoặc kép lồng nhau gây lỗi dòng 250
                      s = s.replace('"$cleanedCode"', "'$cleanedCode'")
                      s = s.replace('"$existingOrderCode"', "'$existingOrderCode'")
                      s = s.replace('"${searchSuffixQuery.trim()}"', "'${searchSuffixQuery.trim()}'")
                      s = s.replace('"${order.orderCode}"', "'${order.orderCode}'")
                      s = s.replace('"${target.groupName}"', "'${target.groupName}'")
                      s = s.replace('"${targetGroup.groupName}"', "'${targetGroup.groupName}'")
                      s = s.replace('"Tạo nhóm mới"', "'Tạo nhóm mới'")
                      s = s.replace('"\\n\\nBạn có muốn', '\\"\\n\\nBạn có muốn')
                      s = s.replace('text = "$message\\n\\nBạn có muốn', 'text = "$message\\\\n\\\\nBạn có muốn')
                      open(p, "w", encoding="utf-8").write(s)
          print("All source files patched successfully!")
          PYEOF
          python3 fix_all.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          if [ -d "ThongKeDonHang" ] && [ -f "ThongKeDonHang/settings.gradle.kts" ]; then
            cd ThongKeDonHang
          fi
          set +e
          gradle assembleDebug --console=plain > build_output.log 2>&1
          EXIT_CODE=$?
          cat build_output.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "================ DONG LOI CU THE ================"
            grep -E "(^e: |FAILURE:|What went wrong:|> Task .* FAILED|Exception|Error)" -A 6 build_output.log
            echo "================================================="
            exit $EXIT_CODE
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ThongKeDonHang-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
